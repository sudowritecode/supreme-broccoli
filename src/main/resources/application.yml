spring:
  application:
    name: plinth-api
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:plinth}
    password: ${RABBITMQ_PASSWORD:plinth-local-dev}
    virtual-host: ${RABBITMQ_VHOST:/}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:plinth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${PLINTH_RABBIT_HEALTH_ENABLED:false}

plinth:
  messaging:
    enabled: ${PLINTH_MESSAGING_ENABLED:false}
    exchange: ${PLINTH_MESSAGE_EXCHANGE:plinth.messages}
    outbound-queue: ${PLINTH_MESSAGE_OUTBOUND_QUEUE:plinth.message.outbound}
    dead-letter-queue: ${PLINTH_MESSAGE_DEAD_LETTER_QUEUE:plinth.message.outbound.dlq}
    routing-key: ${PLINTH_MESSAGE_ROUTING_KEY:message.outbound}
  mini-apps:
    enabled: ${PLINTH_MINI_APPS_ENABLED:false}
    registration-key: ${PLINTH_MINI_APPS_REGISTRATION_KEY:}
    ticket-private-key-base64: ${PLINTH_MINI_APPS_TICKET_PRIVATE_KEY_BASE64:}
    ticket-public-key-base64: ${PLINTH_MINI_APPS_TICKET_PUBLIC_KEY_BASE64:}
    ticket-lifetime-seconds: ${PLINTH_MINI_APPS_TICKET_LIFETIME_SECONDS:300}
