spring:
  datasource:
    url: jdbc:h2:mem:plinth-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

plinth:
  messaging:
    enabled: false
    exchange: plinth.messages
    outbound-queue: plinth.message.outbound
    dead-letter-queue: plinth.message.outbound.dlq
    routing-key: message.outbound
